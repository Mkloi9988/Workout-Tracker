<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0f1113">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#0f1113; --card:#181b1f; --line:#272b31; --text:#eef0f2; --muted:#8b929b;
    --accent:#4ade80; --accent-ink:#06210f; --danger:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px 120px}
  input,textarea,select,button{font:inherit;color:inherit}
  input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px;width:100%;font-size:16px}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{border:0;border-radius:12px;padding:14px 16px;font-weight:600;cursor:pointer}
  .top{display:flex;gap:10px;align-items:center;margin-bottom:6px}
  .top input{font-size:20px;font-weight:700;background:transparent;border-color:transparent;padding:8px 4px}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;white-space:nowrap}
  .meta{color:var(--muted);font-size:13px;margin:0 4px 16px;display:flex;justify-content:space-between;align-items:center}
  .unit{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .unit button{padding:4px 10px;border-radius:0;background:transparent;color:var(--muted);font-size:13px}
  .unit button.on{background:var(--line);color:var(--text)}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .exhead{display:flex;gap:8px;margin-bottom:8px}
  .exhead input{font-weight:600}
  .x{background:transparent;color:var(--muted);padding:8px 10px;font-size:20px;line-height:1}
  .set{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:6px}
  .set .n{color:var(--muted);font-size:13px;text-align:center}
  .set input{padding:10px;text-align:center;font-variant-numeric:tabular-nums}
  .lbls{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;color:var(--muted);font-size:12px;text-align:center;margin-bottom:4px}
  .ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);width:100%;padding:10px}
  .add{background:var(--line);color:var(--text);width:100%;margin-bottom:16px}
  label.h{display:block;color:var(--muted);font-size:13px;margin:4px 4px 6px}
  textarea{min-height:80px;resize:vertical}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,var(--bg) 30%)}
  .bar button{display:block;width:100%;max-width:532px;margin:0 auto;background:var(--accent);color:var(--accent-ink);font-size:17px}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.open{display:flex}
  .panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;overflow:auto}
  .panel h2{margin:0 0 12px;font-size:18px}
  .times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .times input{padding:10px}
  pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;
    font:14px/1.45 ui-monospace,Menlo,monospace;margin:0 0 14px;color:#cfd3d8}
  .row{display:flex;gap:10px}
  .row button{flex:1}
  .sec{background:var(--line);color:var(--text)}
  .pri{background:var(--accent);color:var(--accent-ink)}
  .msg{font-size:14px;margin:0 0 12px;padding:10px 12px;border-radius:10px;display:none}
  .msg.err{display:block;background:#3a1717;color:#fecaca}
  .msg.ok{display:block;background:#123222;color:#bbf7d0}
  .msg a{color:inherit}
  .empty{color:var(--muted);text-align:center;padding:18px 0 22px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <input id="title" placeholder="Workout name (e.g. Push day)" autocomplete="off">
    <span class="timer" id="timer">0:00</span>
  </div>
  <div class="meta">
    <span id="started"></span>
    <span class="unit" id="unit"><button data-u="lb">lb</button><button data-u="kg">kg</button></span>
  </div>

  <div id="list"></div>
  <button class="add" id="addEx">+ Add exercise</button>

  <label class="h" for="notes">Notes</label>
  <textarea id="notes" placeholder="How it felt, cardio, anything else…"></textarea>
  <div style="text-align:center;margin-top:18px">
    <button class="x" id="reset" style="font-size:14px">Discard &amp; start over</button>
  </div>
</div>

<div class="bar"><button id="finish">Finish workout</button></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2>Confirm workout</h2>
    <div class="times">
      <div><label class="h" for="tStart">Start</label><input type="datetime-local" id="tStart"></div>
      <div><label class="h" for="tEnd">End</label><input type="datetime-local" id="tEnd"></div>
    </div>
    <label class="h">Goes in the calendar event</label>
    <pre id="preview"></pre>
    <div class="msg" id="msg"></div>
    <div class="row" id="actions">
      <button class="sec" id="cancel">Back</button>
      <button class="pri" id="save">Save to Google Calendar</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = "wt-draft-v1", UKEY = "wt-unit";
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
    del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
  };

  function fresh(){ return { title:"", start: Date.now(), exercises:[], notes:"" }; }
  var state;
  try { state = JSON.parse(store.get(KEY)) || fresh(); } catch(e){ state = fresh(); }
  var unit = store.get(UKEY) || "lb";
  var saving = false, saved = false;

  var $ = function(id){ return document.getElementById(id); };
  function save(){ store.set(KEY, JSON.stringify(state)); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // ---------- render ----------
  function render(){
    $("title").value = state.title;
    $("notes").value = state.notes;
    $("started").textContent = "Started " + new Date(state.start).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    [].forEach.call($("unit").children, function(b){ b.classList.toggle("on", b.dataset.u === unit); });
    var list = $("list");
    if (!state.exercises.length){
      list.innerHTML = '<div class="empty">No exercises yet — tap “Add exercise”.</div>';
      return;
    }
    list.innerHTML = state.exercises.map(function(ex, i){
      var sets = ex.sets.map(function(s, j){
        return '<div class="set">' +
          '<span class="n">' + (j+1) + '</span>' +
          '<input inputmode="decimal" placeholder="' + unit + '" value="' + esc(s.w) + '" data-i="'+i+'" data-j="'+j+'" data-f="w">' +
          '<input inputmode="numeric" placeholder="reps" value="' + esc(s.r) + '" data-i="'+i+'" data-j="'+j+'" data-f="r">' +
          '<button class="x" data-act="delset" data-i="'+i+'" data-j="'+j+'" aria-label="Remove set">×</button>' +
        '</div>';
      }).join("");
      return '<div class="ex">' +
        '<div class="exhead">' +
          '<input placeholder="Exercise (e.g. Bench press)" value="' + esc(ex.name) + '" data-i="'+i+'" data-f="name" autocomplete="off">' +
          '<button class="x" data-act="delex" data-i="'+i+'" aria-label="Remove exercise">×</button>' +
        '</div>' +
        (ex.sets.length ? '<div class="lbls"><span>#</span><span>Weight ('+unit+')</span><span>Reps</span><span></span></div>' : '') +
        sets +
        '<button class="ghost" data-act="addset" data-i="'+i+'">+ Add set</button>' +
      '</div>';
    }).join("");
  }

  // ---------- events ----------
  $("title").addEventListener("input", function(e){ state.title = e.target.value; save(); });
  $("notes").addEventListener("input", function(e){ state.notes = e.target.value; save(); });

  $("list").addEventListener("input", function(e){
    var t = e.target, i = +t.dataset.i, f = t.dataset.f;
    if (!f) return;
    if (f === "name") state.exercises[i].name = t.value;
    else state.exercises[i].sets[+t.dataset.j][f] = t.value;
    save();
  });

  $("list").addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var i = +b.dataset.i, ex = state.exercises[i];
    if (b.dataset.act === "addset"){
      var last = ex.sets[ex.sets.length-1];
      ex.sets.push(last ? {w:last.w, r:last.r} : {w:"", r:""});
      save(); render();
      var ins = document.querySelectorAll('input[data-i="'+i+'"][data-f="r"]');
      if (ins.length) ins[ins.length-1].focus();
    } else if (b.dataset.act === "delset"){
      ex.sets.splice(+b.dataset.j, 1); save(); render();
    } else if (b.dataset.act === "delex"){
      state.exercises.splice(i, 1); save(); render();
    }
  });

  $("addEx").addEventListener("click", function(){
    state.exercises.push({name:"", sets:[{w:"", r:""}]});
    save(); render();
    var names = document.querySelectorAll('input[data-f="name"]');
    names[names.length-1].focus();
  });

  $("unit").addEventListener("click", function(e){
    var u = e.target.dataset && e.target.dataset.u;
    if (!u) return;
    unit = u; store.set(UKEY, u); render();
  });

  var resetArmed = false;
  $("reset").addEventListener("click", function(){
    if (!resetArmed){
      resetArmed = true; this.textContent = "Tap again to discard";
      var b = this; setTimeout(function(){ resetArmed = false; b.innerHTML = "Discard &amp; start over"; }, 3000);
      return;
    }
    state = fresh(); save(); resetArmed = false; this.innerHTML = "Discard &amp; start over"; render();
  });

  // ---------- timer ----------
  function tick(){
    var s = Math.max(0, Math.floor((Date.now() - state.start)/1000));
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    $("timer").textContent = (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(sec).padStart(2,"0");
  }
  setInterval(tick, 1000);

  // ---------- summary ----------
  function localISO(d){
    var p = function(n){ return String(n).padStart(2,"0"); };
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
  }
  function summaryTitle(){ return "🏋️ " + (state.title.trim() || "Workout"); }
  function summaryBody(){
    var lines = [];
    state.exercises.forEach(function(ex){
      var sets = ex.sets.filter(function(s){ return String(s.w).trim() || String(s.r).trim(); });
      if (!ex.name.trim() && !sets.length) return;
      lines.push(ex.name.trim() || "Exercise");
      sets.forEach(function(s, j){
        var w = String(s.w).trim(), r = String(s.r).trim();
        var txt = (w ? w + " " + unit : "BW") + (r ? " × " + r : "");
        lines.push("  Set " + (j+1) + ": " + txt);
      });
    });
    if (state.notes.trim()){ if (lines.length) lines.push(""); lines.push("Notes: " + state.notes.trim()); }
    return lines.join("\n") || "(no details entered)";
  }

  function setMsg(kind, html){ var m = $("msg"); m.className = "msg " + (kind||""); m.innerHTML = html || ""; }

  $("finish").addEventListener("click", function(){
    saved = false;
    $("tStart").value = localISO(new Date(state.start));
    $("tEnd").value = localISO(new Date());
    $("preview").textContent = summaryTitle() + "\n\n" + summaryBody();
    setMsg("", "");
    $("save").textContent = "Save to Google Calendar";
    $("save").disabled = false;
    $("cancel").textContent = "Back";
    $("sheet").classList.add("open");
  });
  $("cancel").addEventListener("click", function(){
    $("sheet").classList.remove("open");
    if (saved){ state = fresh(); save(); render(); tick(); window.scrollTo(0,0); }
  });

  // ---------- Google Calendar (direct, via Google sign-in) ----------
  // Paste your OAuth client ID from Google Cloud here:
  var CLIENT_ID = "PASTE_YOUR_CLIENT_ID.apps.googleusercontent.com";
  var SCOPE = "https://www.googleapis.com/auth/calendar.events";
  var TKEY = "wt-token", PKEY = "wt-pending", SKEY = "wt-oauth-state";
  var REDIRECT = location.origin + location.pathname;

  function getToken(){
    try { var t = JSON.parse(store.get(TKEY)); if (t && t.exp > Date.now() + 60000) return t.v; } catch(e){}
    return null;
  }
  function signIn(){
    var st = Math.random().toString(36).slice(2);
    store.set(SKEY, st);
    location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({
      client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: "token",
      scope: SCOPE, include_granted_scopes: "true", state: st
    });
  }
  // Coming back from Google sign-in?
  var resume = false;
  if (location.hash.indexOf("access_token=") > -1){
    var h = new URLSearchParams(location.hash.slice(1));
    if (h.get("state") && h.get("state") === store.get(SKEY)){
      store.set(TKEY, JSON.stringify({ v: h.get("access_token"), exp: Date.now() + (+h.get("expires_in") || 3600) * 1000 }));
      resume = !!store.get(PKEY);
    }
    store.del(SKEY);
    history.replaceState(null, "", REDIRECT);
  } else if (location.hash.indexOf("error=") > -1){
    history.replaceState(null, "", REDIRECT);
  }

  async function createEvent(start, end){
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var r = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
      method: "POST",
      headers: { "Authorization": "Bearer " + getToken(), "Content-Type": "application/json" },
      body: JSON.stringify({
        summary: summaryTitle(),
        description: summaryBody(),
        start: { dateTime: start + ":00", timeZone: tz },
        end:   { dateTime: end + ":00",   timeZone: tz },
        colorId: "10",
        reminders: { useDefault: false }
      })
    });
    var body = null; try { body = await r.json(); } catch(e){}
    if (!r.ok){ var e = new Error((body && body.error && body.error.message) || ("HTTP " + r.status)); e.status = r.status; throw e; }
    return body;
  }

  $("save").addEventListener("click", async function(){
    if (saving) return;
    if (saved){ $("cancel").click(); return; }
    var start = $("tStart").value, end = $("tEnd").value;
    if (!start || !end){ setMsg("err", "Set a start and end time."); return; }
    if (end <= start){ setMsg("err", "End time needs to be after the start time."); return; }
    if (CLIENT_ID.indexOf("PASTE_") === 0){ setMsg("err", "Calendar isn't set up yet — the Google client ID still needs to be added."); return; }
    if (!getToken()){
      store.set(PKEY, JSON.stringify({ start: start, end: end }));
      setMsg("", ""); this.textContent = "Signing in to Google…"; this.disabled = true;
      signIn(); return;
    }
    store.del(PKEY);
    saving = true;
    var btn = this; btn.disabled = true; btn.textContent = "Saving…"; setMsg("", "");
    try {
      var ev = await createEvent(start, end);
      saved = true;
      store.del(KEY);
      setMsg("ok", "Saved to your Google Calendar." + (ev && ev.htmlLink ? ' <a href="'+esc(ev.htmlLink)+'" target="_blank" rel="noopener">Open event</a>' : ""));
      btn.textContent = "Start new workout"; btn.disabled = false;
      $("cancel").textContent = "Close";
    } catch(err){
      if (err.status === 401){
        store.del(TKEY);
        setMsg("err", "Your Google sign-in expired. Tap Save to sign in again.");
        btn.textContent = "Save to Google Calendar";
      } else if (err.status === 403){
        setMsg("err", "Google denied access to your calendar: " + esc(err.message) + ". Tap Save to sign in again and allow calendar access.");
        store.del(TKEY);
        btn.textContent = "Save to Google Calendar";
      } else if (err.status){
        setMsg("err", "Google Calendar refused the event: " + esc(err.message));
        btn.textContent = "Try again";
      } else {
        setMsg("err", "No connection to Google. Check your signal — your workout is kept on this phone, so you can save it later.");
        btn.textContent = "Try again";
      }
      btn.disabled = false;
    } finally { saving = false; }
  });

  if (resume){
    try {
      var pend = JSON.parse(store.get(PKEY));
      $("finish").click();
      $("tStart").value = pend.start; $("tEnd").value = pend.end;
      setTimeout(function(){ $("save").click(); }, 50);
    } catch(e){}
  }

  render(); tick();
})();
</script>
</body>
</html>
